# bronze -> silver -> gold -> forecast. No cluster settings, so tasks run on serverless compute.
resources:
  jobs:
    commodities_pipeline:
      name: commodities_pipeline
      max_concurrent_runs: 1
      schedule:  # the World Bank updates early each month; upload the new file before this runs
        quartz_cron_expression: "0 0 7 6 * ?"
        timezone_id: UTC
      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
      tasks:
        - task_key: bronze
          notebook_task: {notebook_path: ../src/01_bronze_ingest.py}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ../src/02_silver_clean.py}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ../src/03_gold_metrics.py}
        - task_key: forecast
          depends_on: [{task_key: gold}]
          notebook_task: {notebook_path: ../src/04_forecast.py}
